<?xml version="1.0" encoding="UTF-8"?>
<!-- ERM Geräteverwaltung (Chen-Notation wie im Unterricht) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="590" viewBox="0 0 1010 590"
     font-family="Calibri, Arial, sans-serif">
  <rect width="1010" height="590" fill="#ffffff"/>
  <text x="505" y="580" font-size="13" fill="#555" text-anchor="middle">ERM Geräteverwaltung</text>

  <!-- Verbindungslinien -->
  <g stroke="#1F3864" stroke-width="2" fill="none">
    <line x1="190" y1="175" x2="225" y2="175"/>   <!-- Standort - steht in -->
    <line x1="365" y1="175" x2="400" y2="175"/>   <!-- steht in - Gerät -->
    <line x1="550" y1="175" x2="590" y2="175"/>   <!-- Gerät - hat Wert -->
    <line x1="730" y1="175" x2="770" y2="175"/>   <!-- hat Wert - Zusatzfeld -->
    <line x1="475" y1="200" x2="475" y2="268"/>   <!-- Gerät - gehört zu -->
    <line x1="475" y1="332" x2="475" y2="400"/>   <!-- gehört zu - Gruppe -->
    <line x1="845" y1="200" x2="845" y2="393"/>   <!-- Zusatzfeld - definiert -->
    <line x1="775" y1="425" x2="550" y2="425"/>   <!-- definiert - Gruppe -->
  </g>

  <!-- Linien zu den Attributen -->
  <g stroke="#1F3864" stroke-width="1.5" fill="none">
    <line x1="65"  y1="103" x2="115" y2="150"/>
    <line x1="175" y1="103" x2="115" y2="150"/>
    <line x1="365" y1="103" x2="475" y2="150"/>
    <line x1="475" y1="68"  x2="475" y2="150"/>
    <line x1="585" y1="103" x2="475" y2="150"/>
    <line x1="745" y1="103" x2="845" y2="150"/>
    <line x1="850" y1="68"  x2="845" y2="150"/>
    <line x1="950" y1="103" x2="845" y2="150"/>
    <line x1="660" y1="207" x2="660" y2="247"/>
    <line x1="365" y1="497" x2="475" y2="450"/>
    <line x1="475" y1="512" x2="475" y2="450"/>
    <line x1="585" y1="497" x2="475" y2="450"/>
  </g>

  <!-- Entitäten -->
  <g stroke="#1F3864" stroke-width="2" fill="#4F81BD">
    <rect x="40"  y="150" width="150" height="50"/>
    <rect x="400" y="150" width="150" height="50"/>
    <rect x="770" y="150" width="150" height="50"/>
    <rect x="400" y="400" width="150" height="50"/>
  </g>
  <g fill="#ffffff" font-size="20" text-anchor="middle">
    <text x="115" y="182">Standort</text>
    <text x="475" y="182">Gerät</text>
    <text x="845" y="182">Zusatzfeld</text>
    <text x="475" y="432">Gruppe</text>
  </g>

  <!-- Beziehungen (Rauten) -->
  <g stroke="#843C0C" stroke-width="2" fill="#F4A460">
    <polygon points="225,175 295,143 365,175 295,207"/>
    <polygon points="590,175 660,143 730,175 660,207"/>
    <polygon points="405,300 475,268 545,300 475,332"/>
    <polygon points="775,425 845,393 915,425 845,457"/>
  </g>
  <g fill="#000" font-size="15" text-anchor="middle">
    <text x="295" y="180">steht in</text>
    <text x="660" y="180">hat Wert</text>
    <text x="475" y="305">gehört zu</text>
    <text x="845" y="430">definiert</text>
  </g>

  <!-- Attribute (Ellipsen), Schlüssel unterstrichen -->
  <g stroke="#1F3864" stroke-width="1.5" fill="#DEEAF6">
    <ellipse cx="65"  cy="85"  rx="52" ry="18"/>
    <ellipse cx="175" cy="85"  rx="52" ry="18"/>
    <ellipse cx="365" cy="85"  rx="52" ry="18"/>
    <ellipse cx="475" cy="50"  rx="52" ry="18"/>
    <ellipse cx="585" cy="85"  rx="52" ry="18"/>
    <ellipse cx="745" cy="85"  rx="50" ry="18"/>
    <ellipse cx="850" cy="50"  rx="50" ry="18"/>
    <ellipse cx="950" cy="85"  rx="50" ry="18"/>
    <ellipse cx="660" cy="265" rx="48" ry="18"/>
    <ellipse cx="365" cy="515" rx="52" ry="18"/>
    <ellipse cx="475" cy="530" rx="52" ry="18"/>
    <ellipse cx="585" cy="515" rx="52" ry="18"/>
  </g>
  <g fill="#000" font-size="14" text-anchor="middle">
    <text x="65"  y="90" text-decoration="underline">StandortID</text>
    <text x="175" y="90">Bezeichnung</text>
    <text x="365" y="90" text-decoration="underline">GeraetID</text>
    <text x="475" y="55">Bezeichnung</text>
    <text x="585" y="90">Bestand</text>
    <text x="745" y="90" text-decoration="underline">FeldID</text>
    <text x="850" y="55">Feldname</text>
    <text x="950" y="90">Sortierung</text>
    <text x="660" y="270">Wert</text>
    <text x="365" y="520" text-decoration="underline">GruppeID</text>
    <text x="475" y="535">Name</text>
    <text x="585" y="520">Datei</text>
  </g>

  <!-- Kardinalitäten -->
  <g fill="#000" font-size="18" font-weight="bold">
    <text x="196" y="167">1</text>
    <text x="384" y="167">n</text>
    <text x="556" y="167">m</text>
    <text x="754" y="167">n</text>
    <text x="483" y="222">n</text>
    <text x="483" y="394">1</text>
    <text x="853" y="222">n</text>
    <text x="556" y="417">1</text>
  </g>

  <!-- Hinweise -->
  <g font-size="13" font-style="italic" fill="#555">
    <text x="590" y="305">m:n mit Attribut „Wert“</text>
    <text x="590" y="323">→ Tabelle geraete_werte</text>
    <text x="590" y="350">je Gruppe max. 3 Zusatzfelder</text>
  </g>
</svg>
